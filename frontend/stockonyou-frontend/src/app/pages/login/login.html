<div class="min-h-screen bg-slate-100 dark:bg-slate-900 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-8 space-y-6">
    <!-- Cabeçalho / Logo -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600 text-white font-bold text-xl shadow-md mb-2">
        E
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">Estoque App</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Gestão Inteligente de Estoque</p>
    </div>

    <!-- Mensagem de Erro -->
    @if (errorMessage()) {
      <div class="p-3 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center">
        {{ errorMessage() }}
      </div>
    }

    <!-- Formulário de Credenciais -->
    <form (submit)="$event.preventDefault(); entrarComCredenciais()" class="space-y-4 pt-4 border-t border-slate-100 dark:border-slate-700/60">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Usuário</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Digite seu usuário"
          class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-slate-900 dark:text-white"
        />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 dark:text-slate-400 mb-1">Senha</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          class="w-full px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm text-slate-900 dark:text-white"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-xl shadow-lg shadow-indigo-500/20 transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50"
      >
        <span>{{ isLoading() ? 'Entrando...' : 'Entrar' }}</span>
      </button>
    </form>
  </div>
</div>
