<header class="bg-slate-900 border-b border-slate-800 text-slate-100 sticky top-0 z-50 shadow-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo & Marca -->
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-sm">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m21 7.5-9-5.25L3 7.5m18 0-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"
            />
          </svg>
        </div>
        <span
          class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent"
        >
          StockOnYou
        </span>
      </div>

      <!-- Informações do Usuário e Logout -->
      <div class="flex items-center space-x-4">
        <!-- Avatar e Detalhes do Usuário -->
        <div
          class="flex items-center space-x-3 bg-slate-800/80 border border-slate-700/60 py-1.5 px-3 rounded-full"
        >
          <!-- Avatar com Inicial -->
          <div
            class="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-semibold text-sm shadow-inner"
          >
            {{ userInitials() }}
          </div>

          <!-- Informações Textuais -->
          <div class="flex flex-col text-left">
            <span class="text-xs font-semibold text-slate-200 leading-tight">
              {{ displayName() }}
            </span>
            <span class="text-[11px] text-slate-400 leading-tight">
              {{ email() }}
            </span>
          </div>
        </div>

        <!-- Botão de Logout -->
        <button
          (click)="logout()"
          title="Encerrar Sessão"
          class="inline-flex items-center justify-center gap-2 px-3.5 py-2 rounded-xl text-xs font-medium text-slate-300 bg-slate-800 hover:bg-red-500/10 hover:text-red-400 hover:border-red-500/30 border border-slate-700 transition-all duration-200 cursor-pointer active:scale-95"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25"
            />
          </svg>
          <span>Sair</span>
        </button>
      </div>
    </div>
  </div>
</header>
