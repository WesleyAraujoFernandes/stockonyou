<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
  <!-- Topbar Horizontal (Mantido para Logo, Perfil e Sair) -->
  <app-header />

  <!-- Conteúdo Principal com Sidebar + Área de Páginas -->
  <div class="flex flex-1 relative overflow-hidden">
    <!-- Sidebar Vertical Esquerda -->
    <aside
      [class.w-64]="isSidebarOpen()"
      [class.w-20]="!isSidebarOpen()"
      class="bg-slate-900 border-r border-slate-800/80 transition-all duration-300 ease-in-out flex flex-col justify-between select-none z-40 shrink-0"
    >
      <div class="p-3">
        <!-- Botão para Expandir/Recolher Sidebar -->
        <button
          (click)="toggleSidebar()"
          class="w-full flex items-center justify-between p-2.5 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 transition-all mb-4 border border-transparent hover:border-slate-700/50"
          [title]="isSidebarOpen() ? 'Recolher menu' : 'Expandir menu'"
        >
          <span
            *ngIf="isSidebarOpen()"
            class="text-xs font-semibold uppercase tracking-wider text-slate-500"
          >
            Navegação
          </span>
          
          <!-- SINTAXE OFICIAL 1: Ícone estático aplicando o seletor diretamente no atributo do SVG -->
          <svg 
            lucideMenu 
            [class.rotate-180]="!isSidebarOpen()"
            class="w-5 h-5 transition-transform duration-300 mx-auto"
          ></svg>
        </button>

        <!-- Links do Menu Cadastros -->
        <nav class="space-y-1">
          <a
            *ngFor="let item of menuItems"
            [routerLink]="item.route"
            routerLinkActive="bg-indigo-600/10 text-indigo-400 border-indigo-500/50"
            [routerLinkActiveOptions]="{ exact: false }"
            class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 border border-transparent transition-all group"
            [title]="!isSidebarOpen() ? item.label : ''"
          >
            <!-- SINTAXE OFICIAL 2: Ícone dinâmico da lista injetando o objeto através de [lucideIcon] -->
            <svg 
              [lucideIcon]="item.icon" 
              class="w-5 h-5 shrink-0 group-hover:scale-110 transition-transform"
            ></svg>

            <!-- Rótulo do Item (Oculto quando a sidebar recolhe) -->
            <span *ngIf="isSidebarOpen()" class="truncate">
              {{ item.label }}
            </span>
          </a>
        </nav>
      </div>

      <!-- Rodapé da Sidebar (Informação do Sistema) -->
      <div class="p-3 border-t border-slate-800/80">
        <div
          *ngIf="isSidebarOpen()"
          class="px-3 py-2 rounded-lg bg-slate-950/40 border border-slate-800/50 text-[11px] text-slate-500 flex justify-between items-center"
        >
          <span>Módulo Cadastros</span>
          <span class="font-mono text-[10px] text-indigo-400">v1.0</span>
        </div>
      </div>
    </aside>

    <!-- Área Central de Conteúdo Dinâmico (Router Outlet) -->
    <main class="flex-1 overflow-y-auto p-6 sm:p-8 bg-slate-950">
      <div class="max-w-7xl mx-auto">
        <router-outlet />
      </div>
    </main>
  </div>
</div>
<app-toast></app-toast>
