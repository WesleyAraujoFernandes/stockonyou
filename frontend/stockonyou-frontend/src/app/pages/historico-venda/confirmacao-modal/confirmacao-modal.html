<div class="fixed inset-0 z-[60] flex items-center justify-center bg-slate-950/80 backdrop-blur-xs p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-5">
    <div class="border-b border-slate-800 pb-3">
      <h2 class="text-base font-bold text-white">
        {{ titulo() }}
      </h2>
    </div>
    <p class="text-sm text-slate-300">
      {{ mensagem() }}
    </p>
    <div class="flex justify-end gap-2 border-t border-slate-800 pt-4">
      <button
        type="button"
        (click)="confirmado.emit()"
        class="px-4 py-2 text-white font-medium text-xs rounded-xl transition cursor-pointer"
        [ngClass]="{
          'bg-red-600 hover:bg-red-500': variante() === 'danger',
          'bg-emerald-600 hover:bg-emerald-500': variante() === 'success'
        }"
        >
        {{ textoConfirmar() }}
      </button>
      <button
        type="button"
        (click)="cancelado.emit()"
        class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs rounded-xl transition cursor-pointer">
        {{ textoCancelar() }}
      </button>
    </div>
  </div>
</div>
