server:
  port: 8080

spring:
  application:
    name: stockonyou

  datasource:
    url: jdbc:postgresql://localhost:5432/estoque_db
    username: postgres
    password: postgres_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8091/realms/estoque-realm
          jwk-set-uri: http://localhost:8091/realms/estoque-realm/protocol/openid-connect/certs